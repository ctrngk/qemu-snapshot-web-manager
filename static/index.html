<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QEMU Snapshot Manager</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script>
        // Theme: check localStorage then prefers-color-scheme (run before paint)
        (function() {
            var saved = localStorage.getItem('theme');
            if (saved) {
                document.documentElement.setAttribute('data-theme', saved);
            } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>🖥️ QEMU Snapshot Manager</h1>
            <div class="header-right">
                <span id="backend-status"
                      hx-get="/api/ping"
                      hx-trigger="load"
                      hx-swap="innerHTML">
                    connecting…
                </span>
                <button class="btn btn-sm btn-ghost" onclick="location.reload(true)" title="Reload the entire page and re-fetch all data from the server" style="font-size:0.8em">🔄 Hard Refresh</button>
                <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">☀️</button>
            </div>
        </div>
    </header>

    <!-- Sidebar toggle button (visible on all screen sizes) -->
    <button class="sidebar-toggle" onclick="toggleSidebar()" title="Toggle VM sidebar">☰</button>

    <!-- Overlay for sidebar on medium/small screens -->
    <div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <main class="layout" id="main-layout">
        <!-- Left Panel: VM List -->
        <aside class="panel vm-panel">
            <div class="panel-header">
                <h2>Virtual Machines</h2>
                <button class="btn btn-sm btn-ghost"
                        hx-get="/api/vms"
                        hx-target="#vm-list"
                        hx-swap="innerHTML"
                        title="Refresh">
                    ↻
                </button>
            </div>
            <div id="vm-list"
                 hx-get="/api/vms"
                 hx-trigger="load, vmStateChanged from:body, every 10s"
                 hx-swap="innerHTML">
                <p class="placeholder">Loading VMs… <span class="spinner"></span></p>
            </div>
            <div id="vm-notification"></div>
        </aside>

        <!-- Center Panel: Snapshot Tree -->
        <section class="panel tree-panel">
            <div class="panel-header">
                <h2>Snapshot Tree</h2>
                <div id="tree-toolbar" class="toolbar" style="display:none;">
                    <button id="btn-toggle-labels" class="btn btn-sm btn-secondary"
                            onclick="toggleLabelMode()"
                            title="Toggle between date and description labels">
                        📅 Date
                    </button>
                    <button id="btn-create-snap" class="btn btn-sm btn-primary"
                            hx-get=""
                            hx-target="#modal-container"
                            hx-swap="innerHTML">
                        + New Snapshot
                    </button>
                </div>
            </div>
            <div id="orphan-check"></div>
            <div id="snapshot-tree" class="tree-container">
                <p class="placeholder">Select a VM to view snapshots</p>
            </div>
        </section>

        <!-- Right Panel: Tabbed Details -->
        <aside class="panel detail-panel">
            <div class="tab-bar">
                <button class="tab active" data-tab="snapshot-detail" onclick="switchTab(this)">Snapshot</button>
                <button class="tab" data-tab="shared-folders" onclick="switchTab(this)">Shared Folders</button>
            </div>

            <!-- Tab 1: Snapshot Details -->
            <div id="snapshot-detail" class="tab-content active">
                <div class="detail-section">
                    <p class="placeholder">Select a snapshot for details</p>
                </div>
            </div>

            <!-- Tab 2: Shared Folders -->
            <div id="shared-folders" class="tab-content">
                <div class="panel-header">
                    <h2>Folders</h2>
                    <button id="btn-add-folder" class="btn btn-sm btn-primary"
                            hx-get=""
                            hx-target="#modal-container"
                            hx-swap="innerHTML"
                            style="display:none;">
                        + Add Folder
                    </button>
                </div>
                <div id="folder-notification-persistent"></div>
                <div id="shared-folders-content" class="detail-section">
                    <p class="placeholder">Select a VM</p>
                </div>
            </div>
        </aside>
    </main>

    <!-- Modal container -->
    <div id="modal-container"></div>

    <!-- Toast notifications -->
    <div id="toast-container"></div>

    <!-- D3.js tree visualization -->
    <script src="/tree.js"></script>

    <!-- Global event handlers & UI logic -->
    <script>
        /* ── Theme Toggle ─────────────────────────────────────── */
        function toggleTheme() {
            var current = document.documentElement.getAttribute('data-theme');
            var next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateThemeIcon();
        }

        function updateThemeIcon() {
            var btn = document.querySelector('.theme-toggle');
            if (!btn) return;
            var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            btn.textContent = isDark ? '☀️' : '🌙';
        }
        updateThemeIcon();

        /* ── Sidebar Toggle ───────────────────────────────────── */
        function toggleSidebar() {
            var layout = document.getElementById('main-layout');
            var overlay = document.getElementById('sidebar-overlay');
            layout.classList.toggle('sidebar-collapsed');
            var isCollapsed = layout.classList.contains('sidebar-collapsed');
            var isMedium = window.innerWidth < 1200;
            if (isMedium) {
                overlay.classList.toggle('visible', !isCollapsed);
            }
        }

        // Auto-collapse sidebar on medium/small screens
        (function() {
            if (window.innerWidth < 1200) {
                document.getElementById('main-layout').classList.add('sidebar-collapsed');
            }
        })();

        /* ── Tab Switching ────────────────────────────────────── */
        function switchTab(tabBtn) {
            document.querySelectorAll('.tab-bar .tab').forEach(function(t) {
                t.classList.remove('active');
            });
            document.querySelectorAll('.tab-content').forEach(function(c) {
                c.classList.remove('active');
            });
            tabBtn.classList.add('active');
            var target = document.getElementById(tabBtn.getAttribute('data-tab'));
            if (target) target.classList.add('active');
        }

        /* ── Toast ────────────────────────────────────────────── */
        function showToast(message, type) {
            var toast = document.createElement('div');
            toast.className = 'toast toast-' + (type || 'info');
            toast.textContent = message;
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(function() { toast.remove(); }, 4000);
        }

        /* ── HTMX Event Handlers ──────────────────────────────── */
        var _lastVmListHtml = '';
        document.body.addEventListener('htmx:afterSwap', function(evt) {
            /* Re-apply active class to selected VM after VM list refreshes */
            if (evt.detail.target && evt.detail.target.id === 'vm-list') {
                if (window.currentVm) {
                    var sel = document.querySelector('.vm-item[data-vm="' + window.currentVm + '"]');
                    if (sel) sel.classList.add('active');
                }
                /* Re-apply Start button state if a snapshot is selected */
                if (typeof _selectedSnapId !== 'undefined' && _selectedSnapId !== null
                    && typeof updateStartButton === 'function') {
                    updateStartButton(_selectedIsCurrent);
                }
                /* Detect VM state changes and trigger tree refresh */
                var newHtml = evt.detail.target.innerHTML;
                if (_lastVmListHtml && newHtml !== _lastVmListHtml) {
                    document.body.dispatchEvent(new CustomEvent('vmStateChanged'));
                }
                _lastVmListHtml = newHtml;
            }
        });

        document.body.addEventListener('htmx:beforeSwap', function(evt) {
            var status = evt.detail.xhr.status;
            if (status >= 400 && status < 600) {
                evt.detail.shouldSwap = true;
                evt.detail.isError = false;
            }
        });

        /* ── VM Selection ─────────────────────────────────────── */
        function selectVm(vmName) {
            // Remove active class from all VM items
            document.querySelectorAll('.vm-item').forEach(function(el) {
                el.classList.remove('active');
            });
            var selected = document.querySelector('.vm-item[data-vm="' + vmName + '"]');
            if (selected) selected.classList.add('active');

            // Switch to Snapshot tab so the tree is visible
            var snapTab = document.querySelector('.tab[data-tab="snapshot-detail"]');
            if (snapTab) switchTab(snapTab);

            // Update the create snapshot button
            var toolbar = document.getElementById('tree-toolbar');
            toolbar.style.display = 'flex';
            var btn = document.getElementById('btn-create-snap');
            btn.setAttribute('hx-get', '/api/vms/' + vmName + '/snapshots/form');
            htmx.process(btn);

            // Initialize toggle button to reflect stored mode
            if (typeof updateToggleButton === 'function') updateToggleButton();

            // Load snapshot tree (JSON for D3.js)
            if (typeof loadSnapshotTree === 'function') {
                loadSnapshotTree(vmName);
            } else {
                document.getElementById('snapshot-tree').innerHTML =
                    '<p class="placeholder">Tree visualization loading…</p>';
            }

            // Load orphan snapshot check (polls every 5 min + on VM state change)
            var orphanDiv = document.getElementById('orphan-check');
            orphanDiv.setAttribute('hx-get', '/api/vms/' + vmName + '/orphan-check');
            orphanDiv.setAttribute('hx-trigger', 'load, vmStateChanged from:body, every 10s');
            orphanDiv.setAttribute('hx-swap', 'innerHTML');
            htmx.process(orphanDiv);
            htmx.ajax('GET', '/api/vms/' + vmName + '/orphan-check', {
                target: '#orphan-check', swap: 'innerHTML'
            });

            // Load shared folders (refreshes on add/remove/mount/unmount AND revert/state changes)
            var sfDiv = document.getElementById('shared-folders-content');
            sfDiv.setAttribute('hx-get', '/api/vms/' + vmName + '/shared-folders');
            sfDiv.setAttribute('hx-trigger', 'vmStateChanged from:body, every 10s');
            sfDiv.setAttribute('hx-swap', 'innerHTML');
            htmx.process(sfDiv);
            htmx.ajax('GET', '/api/vms/' + vmName + '/shared-folders', {
                target: '#shared-folders-content', swap: 'innerHTML'
            });

            // Show and update the add-folder button
            var folderBtn = document.getElementById('btn-add-folder');
            folderBtn.style.display = 'inline-flex';
            folderBtn.setAttribute('hx-get', '/api/vms/' + vmName + '/shared-folders/form');
            htmx.process(folderBtn);

            // Store current VM
            window.currentVm = vmName;

            // On medium/small screens, close sidebar after selection
            if (window.innerWidth < 1200) {
                var layout = document.getElementById('main-layout');
                layout.classList.add('sidebar-collapsed');
                document.getElementById('sidebar-overlay').classList.remove('visible');
            }
        }

        // Shared folder operations use two trigger types:
        // - sharedFoldersUpdating (add/mount/automount): spinner + 3s delay
        //   so the guest has time to mount before we query status
        // - sharedFoldersChanged (unmount/detach): immediate refresh since
        //   the operation is already complete server-side
        document.body.addEventListener('sharedFoldersUpdating', function() {
            if (window.currentVm) {
                var sfDiv = document.getElementById('shared-folders-content');
                sfDiv.innerHTML = '<p class="placeholder">Updating\u2026 <span class="spinner"></span></p>';
                setTimeout(function() {
                    htmx.ajax('GET', '/api/vms/' + window.currentVm + '/shared-folders', {
                        target: '#shared-folders-content', swap: 'innerHTML'
                    });
                }, 3000);
            }
        });
        document.body.addEventListener('sharedFoldersChanged', function() {
            if (window.currentVm) {
                htmx.ajax('GET', '/api/vms/' + window.currentVm + '/shared-folders', {
                    target: '#shared-folders-content', swap: 'innerHTML'
                });
            }
        });

        // vmStateChanged delayed retries are no longer needed — the 10s
        // hard-refresh poll on every panel catches guest-agent readiness.

        /* ── Directory Browser ────────────────────────────────── */
        function openDirBrowser() {
            var existing = document.getElementById('dir-browser-modal');
            if (existing) existing.remove();

            var modal = document.createElement('div');
            modal.id = 'dir-browser-modal';
            modal.className = 'modal-overlay';
            modal.onclick = function(e) { if (e.target === modal) modal.remove(); };
            modal.innerHTML = '<div class="modal" onclick="event.stopPropagation()">' +
                '<h3>Select Directory</h3>' +
                '<div id="dir-browser-content"><p class="placeholder">Loading… <span class="spinner"></span></p></div>' +
                '</div>';
            document.body.appendChild(modal);

            htmx.ajax('GET', '/api/browse', {target: '#dir-browser-content', swap: 'innerHTML'});
        }

        function selectDirectory(path) {
            document.getElementById('sf-source-dir').value = path;
            var p = path.replace(/\/$/, '');
            var n = p.split('/').pop() || 'share';
            document.getElementById('sf-mount-tag').value = 'sf_' + n.replace(/[^a-zA-Z0-9_-]/g, '_');
            var modal = document.getElementById('dir-browser-modal');
            if (modal) modal.remove();
        }
    </script>
</body>
</html>
